
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - User Directory</title>
    <script src="users.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 0 16px;
            line-height: 1.6;
            color: #243247;
        }

        button, input {
            padding: 10px;
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        #filter-input {
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        #status {
            margin: 16px 0;
            font-weight: bold;
        }

        #users-list {
            list-style: none;
            padding: 0;
        }

        #users-list li {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
        }

        #users-list h3 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>User Directory</h1>
        <p>Load and search users from a public API.</p>
    </header>

    <main>
        <section>
            <button id="load-users" type="button">Load Users</button>

            <p id="status" role="status">Click "Load Users" to begin.</p>

            <label for="filter-input">Filter users by name:</label>
            <br>
            <input
                type="text"
                id="filter-input"
                placeholder="Enter a name..."
            >
        </section>

        <section>
            <h2>Users</h2>
            <ul id="users-list"></ul>
        </section>
    </main>
</body>
</html>
